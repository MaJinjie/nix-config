# Server options
set -s -a terminal-features ",foot*:RGB:extkeys:osc7:sixel"
set -s -a terminal-overrides ',foot*:Tc'
set -s set-clipboard on
set -s extended-keys on

#FIX: To have undercurls show up and in color. (https://github.com/folke/tokyonight.nvim#-overriding-colors--highlight-groups)
set -s -a terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -s -a terminal-overrides ',*:Setulc=\E[58::2::::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# Session options
set -g renumber-windows on
set -g display-time 2000

# Window options
set -g main-pane-width 60%
set -g main-pane-height 70%

# Status line
set -g status on
set -g status-position top
set -g status-justify centre
set -g status-interval 10
set -g status-keys emacs

# Custom options
set -g @popup-x C
set -g @popup-y C
set -g @popup-w 70%
set -g @popup-h 80%

# Keybindings
## prefix
bind -T prefix -N "cancel prefix mode" Escape switch-client -T root
bind -T prefix -N "prompt for a tmux command" ':' command-prompt
bind -T prefix -N 'split window right' | splitw -h
bind -T prefix -N 'split window down' _ splitw -v
bind -T prefix -N "choose window" w run 'tmux choose-tree -Nwf"##{==:##{session_name},#{session_name}}"'
bind -T prefix -N "choose session" s choose-tree -Zs
bind -T prefix -N "detach the current client" d detach-client
bind -T prefix -N "choose and detach a client from a list" D choose-client -Z
bind -T prefix -N "Choose buffer" b choose-buffer -Z
bind -T prefix -N "new window" n neww
bind -T prefix -N "new session" N new
bind -T prefix -N "rename window"  r command-prompt -I "#W" { rename-window  "%%" }
bind -T prefix -N "rename session" R command-prompt -I "#S" { rename-session "%%" }
bind -T prefix -N "kill current pane" x unlinkw -k
bind -T prefix -N "kill current window" X kill-session
bind -T prefix -N "kill all except current pane" o kill-pane -a
bind -T prefix -N "kill all except current window" O kill-window -a
bind -T prefix -N "select layout" Space menu -T "select layout" \
												"even-horizontal" | "select-layout even-horizontal" \
												"main-horizontal" k "select-layout main-horizontal" \
												"main-horizontal-mirrored" j "select-layout main-horizontal-mirrored" \
												"" \
												"even-vertical" _ "select-layout even-vertical" \
												"main-vertical" h "select-layout main-vertical" \
												"main-vertical-mirrored" l "select-layout main-vertical-mirrored" \
												"" \
												"tiled" = "select-layout tiled"
bind -T prefix -N "split window" Enter menu -T "split window" \
											   "left" h "splitw -bh -c \"#{pane_current_path}\"" \
											   "down" j "splitw -v -c \"#{pane_current_path}\"" \
											   "up" k "splitw -bv -c \"#{pane_current_path}\"" \
											   "right" l "splitw -h -c \"#{pane_current_path}\"" \
											   "Left" H "splitw -fbh -c \"#{pane_current_path}\"" \
											   "Down" J "splitw -fv -c \"#{pane_current_path}\"" \
											   "Up" K "splitw -fbv -c \"#{pane_current_path}\"" \
											   "Right" L "splitw -fh -c \"#{pane_current_path}\""

## root
bind -T root 'M-S-|' splitw -h -c '#{pane_current_path}'
bind -T root 'M-S-_' splitw -v -c '#{pane_current_path}'
bind -T root 'M-S-+' resizep -Z
bind -T root 'M-0' selectw -l
bind -T root 'M-\' switchc -l
bind -T root 'M-S-<' rotate-window
bind -T root 'M-S->' rotate-window -D
bind -T root 'M-S-{' swap-pane -U
bind -T root 'M-S-}' swap-pane -D
# 'M-[' don't use with yazi inside tmux, instead of 'M-Escape'.
bind -T root 'M-Escape' copy-mode
# In non extended-keys, 'M-BSpace' don't use within tmux, instead of 'M-Delete'.
bind -T root 'M-BSpace' killp
bind -T root 'M-S-:' command-prompt
bind -T root 'M-.' if -F '#{==:#{session_group},popup}' 'detach-client' 'run -C "popup -E -d#{pane_current_path} -x#{@popup-x} -y#{@popup-y} -w#{@popup-w} -h#{@popup-h} -brounded -TScratch tmux new -A -spopup-#S -tpopup"'
bind -T root 'S-Enter' send '[27;2;13~'
bind -T root 'C-Enter' send '[27;5;13~'
# bind -T root 'M-Enter' if -F "#{==:nvim,#{pane_current_command}}" 'send M-Enter' neww
bind -T root 'M-Enter' neww

## copy-mode
bind -T copy-mode-vi  -N "Select word"                    .       send -X select-word
bind -T copy-mode-vi  -N "Start visual selection"         v       send -X begin-selection
bind -T copy-mode-vi  -N "Start visual line"              V       send -X select-line
bind -T copy-mode-vi  -N "Start visual block"             C-v     { send -X rectangle-toggle; send -X begin-selection }
bind -T copy-mode-vi  -N "Set mark"                       m       send -X set-mark
bind -T copy-mode-vi  -N "Goto mark"                      "'"     send -X jump-to-mark
bind -T copy-mode-vi  -N "Forward search"                 /       command-prompt -p "forward:" -i 'send -X search-forward-incremental "%%"'
bind -T copy-mode-vi  -N "Backward search"                ?       command-prompt -p "backward:" -i 'send -X search-backward-incremental "%%"'

bind -T copy-mode-vi  -N "Copy"                           y       send -X copy-selection "tmux"
bind -T copy-mode-vi  -N "Copy to end of line"            Y       send -X copy-selection-end-of-line "tmux"
bind -T copy-mode-vi  -N "Copy and cancel"                c       send -X copy-selection-and-cancel "tmux"
bind -T copy-mode-vi  -N "Copy to end of line and cancel" C       send -X copy-selection-end-of-line-and-cancel "tmux"
bind -T copy-mode-vi  -N "Append the selection"           A       send -X append-selection

bind -T copy-mode-vi  -N "Exit copy mode"                 q       send -X cancel
bind -T copy-mode-vi  -N "Exit copy mode"                 i       send -X cancel
bind -T copy-mode-vi  -N "Exit copy mode"                 a       send -X cancel

bind -T copy-mode-vi  -N "Scroll down by half a page"     d       send 'C-d'
bind -T copy-mode-vi  -N "Scroll up by half a page"       u       send 'C-u'
bind -T copy-mode-vi  -N "Move to previous prompt"        [       send -X previous-prompt -o
bind -T copy-mode-vi  -N "Move to next prompt"            ]       send -X next-prompt -o

## others
bind -T root 'M-1' select-window -T -t 1
bind -T root 'M-2' select-window -T -t 2
bind -T root 'M-3' select-window -T -t 3
bind -T root 'M-4' select-window -T -t 4
bind -T root 'M-5' select-window -T -t 5
bind -T root 'M-6' select-window -T -t 6
bind -T root 'M-7' select-window -T -t 7
bind -T root 'M-8' select-window -T -t 8
bind -T root 'M-9' select-window -T -t 9
bind -T prefix -N "focus to left"    'h' select-pane -ZL
bind -T prefix -N "focus to bottom"  'j' select-pane -ZD
bind -T prefix -N "focus to top"     'k' select-pane -ZU
bind -T prefix -N "focus to right"   'l' select-pane -ZR
bind -T prefix -N "resize to left"   -r 'H' resize-pane -L 2
bind -T prefix -N "resize to bottom" -r 'J' resize-pane -D 2
bind -T prefix -N "resize to top"    -r 'K' resize-pane -U 2
bind -T prefix -N "resize to right"  -r 'L' resize-pane -R 2
bind -T root -N "focus to left"    'M-h' if -F "#{==:nvim,#{pane_current_command}}" 'send M-h'   'if -F "#{pane_at_left}"   "" "select-pane -L"'
bind -T root -N "focus to bottom"  'M-j' if -F "#{==:nvim,#{pane_current_command}}" 'send M-j'   'if -F "#{pane_at_bottom}" "" "select-pane -D"'
bind -T root -N "focus to top"     'M-k' if -F "#{==:nvim,#{pane_current_command}}" 'send M-k'   'if -F "#{pane_at_top}"    "" "select-pane -U"'
bind -T root -N "focus to right"   'M-l' if -F "#{==:nvim,#{pane_current_command}}" 'send M-l'   'if -F "#{pane_at_right}"  "" "select-pane -R"'
bind -T root -N "resize to left"   'M-S-H' if -F "#{==:nvim,#{pane_current_command}}" 'send M-H'   'resize-pane -L 2'
bind -T root -N "resize to bottom" 'M-S-J' if -F "#{==:nvim,#{pane_current_command}}" 'send M-J'   'resize-pane -D 2'
bind -T root -N "resize to top"    'M-S-K' if -F "#{==:nvim,#{pane_current_command}}" 'send M-K'   'resize-pane -U 2'
bind -T root -N "resize to right"  'M-S-L' if -F "#{==:nvim,#{pane_current_command}}" 'send M-L'   'resize-pane -R 2'
bind -T copy-mode-vi -N "focus to left"    'M-h' if -F "#{==:nvim,#{pane_current_command}}" 'send M-h'   'if -F "#{pane_at_left}"   "" "select-pane -L"'
bind -T copy-mode-vi -N "focus to bottom"  'M-j' if -F "#{==:nvim,#{pane_current_command}}" 'send M-j'   'if -F "#{pane_at_bottom}" "" "select-pane -D"'
bind -T copy-mode-vi -N "focus to top"     'M-k' if -F "#{==:nvim,#{pane_current_command}}" 'send M-k'   'if -F "#{pane_at_top}"    "" "select-pane -U"'
bind -T copy-mode-vi -N "focus to right"   'M-l' if -F "#{==:nvim,#{pane_current_command}}" 'send M-l'   'if -F "#{pane_at_right}"  "" "select-pane -R"'
bind -T copy-mode-vi -N "resize to left"   'M-S-H' if -F "#{==:nvim,#{pane_current_command}}" 'send M-H' '  resize-pane -L 2'
bind -T copy-mode-vi -N "resize to bottom" 'M-S-J' if -F "#{==:nvim,#{pane_current_command}}" 'send M-J' '  resize-pane -D 2'
bind -T copy-mode-vi -N "resize to top"    'M-S-K' if -F "#{==:nvim,#{pane_current_command}}" 'send M-K' '  resize-pane -U 2'
bind -T copy-mode-vi -N "resize to right"  'M-S-L' if -F "#{==:nvim,#{pane_current_command}}" 'send M-L' '  resize-pane -R 2'


# Hooks
set-hook -g session-created  "if -F '#{==:#{session_group},popup}' 'set status off'"